spring:
  application:
    name: coop-core
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3311}/${DB_NAME:iaccsbsucmpc01}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila&zeroDateTimeBehavior=CONVERT_TO_NULL
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      naming:
        # Legacy column names are mixed-case (e.g. ClientIDBrCode); keep them exactly as declared.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      # Legacy schema is owned by the existing system; never let Hibernate alter it.
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect

# Placeholder auth until the Keycloak phase (ECIS Phase 3). Set both to enable API access.
coop:
  dev-auth:
    username: ${DEV_API_USER}
    password: ${DEV_API_PASSWORD}
  edit:
    # Member editing writes to the legacy client table. Off unless COOP_EDIT_ENABLED=true, and even then only
    # when the audit table exists. Run the app as a limited database user, not root, before turning it on.
    enabled: ${COOP_EDIT_ENABLED:false}

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
