<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coop Platform</title>
    <style>
      @keyframes coop-pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      /* A detached window is shown only once it has painted, then its content eases in; on close it eases out before the window goes. */
      html[data-win='pre'] #root { opacity: 0; }
      html[data-win='in'] #root { animation: coop-pop 320ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      html[data-win='out'] #root { opacity: 0; transform: scale(0.985); transition: opacity 170ms ease-in, transform 170ms ease-in; }
      @media (prefers-reduced-motion: reduce) {
        html[data-win='in'] #root { animation: none; }
        html[data-win='out'] #root { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
