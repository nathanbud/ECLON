[package]
name = "app"
version = "0.1.0"
description = "Coop Platform: Enterprise Cooperative Information System"
authors = ["NSK Tech"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
# One copy of the app per PC: opening it again brings the running window forward.
tauri-plugin-single-instance = "2"
# The main window opens where and as large as it was left.
tauri-plugin-window-state = "2"

# Printing straight to the default printer (no print window) goes through the Windows web view.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"
